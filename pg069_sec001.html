    <script>
      (() => {
        for (const source of document.querySelectorAll('.sr-only[data-id]')) {
          const proxies = document.querySelectorAll(`[data-calculation-highlight-proxy="${source.dataset.id}"]`)
          if (!proxies.length) continue

          const syncHighlight = () => {
            const isActive = source.classList.contains('bg-yellow-300') || Boolean(source.querySelector('.bg-yellow-300'))
            for (const proxy of proxies) proxy.classList.toggle('bg-yellow-300', isActive)
          }

          new MutationObserver(syncHighlight).observe(source, { attributes: true, childList: true, subtree: true })
          syncHighlight()
        }
      })()
    </script>
