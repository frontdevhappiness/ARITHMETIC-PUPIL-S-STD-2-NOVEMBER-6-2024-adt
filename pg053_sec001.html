    <script>
      (() => {
        /* Keep each column sum visually intact while its separate narration
         * source receives the runtime's timed word highlighting. */
        for (const row of document.querySelectorAll('.pg053-question-grid [data-id]')) {
          if (row.childElementCount === 0) continue

          const id = row.dataset.id
          const source = document.createElement('span')
          source.dataset.id = id
          source.className = 'sr-only'
          source.textContent = (row.textContent || '').replace(/\s+/g, '')
          row.before(source)

          row.removeAttribute('data-id')
          row.dataset.ttsHighlightProxy = id
          row.setAttribute('aria-hidden', 'true')

          const syncRowHighlight = () => {
            const isActive = source.classList.contains('bg-yellow-300') || Boolean(source.querySelector('.bg-yellow-300'))
            row.classList.toggle('bg-yellow-300', isActive)
          }

          new MutationObserver(syncRowHighlight).observe(source, {
            attributes: true,
            childList: true,
            subtree: true,
          })
          syncRowHighlight()
        }
      })()
    </script>
