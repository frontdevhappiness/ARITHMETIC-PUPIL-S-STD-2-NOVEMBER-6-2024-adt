      <h1 data-id="pg066_n0063" class="mb-5 text-4xl font-bold leading-tight text-neutral-900 max-lg:text-3xl max-sm:mb-4 max-sm:text-2xl">

      </h1>

      <!-- Question 1 -->
      <div class="mb-8 flex items-start gap-4 max-sm:mb-5 max-sm:gap-3">
        <span data-id="pg066_n0064" class="shrink-0 text-3xl italic text-sky-500 max-lg:text-2xl max-sm:text-xl">
          1.
        </span>

        <span data-id="pg066_n0065" class="max-w-4xl text-3xl italic leading-snug max-lg:text-2xl max-sm:text-lg">
          Use the direction of the arrows to fill the missing numbers in the balloons.
        </span>
      </div>

      <div class="relative mx-auto w-full max-w-4xl">
        <img data-id="pg066_upload1" src="images/pg066_upload1.png" alt="First balloon puzzle. Follow the arrows from top to bottom and from left to right. Nine hundred minus one hundred equals eight hundred. Nine hundred minus the number in the purple balloon equals six hundred. Along the bottom, eight hundred minus the number in the red balloon equals six hundred." class="block h-auto w-full max-w-full object-contain" style="max-width: 100%; height: auto;">

        <input type="text" inputmode="numeric" autocomplete="off" data-aria-id="aria-1-0-0" data-activity-item="item-1" aria-label="Missing number in the purple balloon" tabindex="0" class="balloon-answer left-[69%] top-[47.5%] border-purple-600 text-black">

        <input type="text" inputmode="numeric" autocomplete="off" data-aria-id="aria-1-0-1" data-activity-item="item-2" aria-label="Missing number in the red balloon" tabindex="0" class="balloon-answer left-[50%] top-[81%] border-red-600 text-black">
      </div>

      <!-- Question 2 -->
      <div class="my-12 border-t-2 border-sky-100 max-sm:my-8"></div>

      <div class="mb-8 flex items-start gap-4 max-sm:mb-5 max-sm:gap-3">

        <span data-id="pg066_n0073" class="max-w-4xl text-3xl italic leading-snug max-lg:text-2xl max-sm:text-lg">

        <input type="text" inputmode="numeric" autocomplete="off" data-aria-id="aria-1-0-2" data-activity-item="item-3" aria-label="Missing number in the top-right purple balloon" tabindex="0" class="balloon-answer left-[70%] top-[18%] border-purple-600 text-black">
